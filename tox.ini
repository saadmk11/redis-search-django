[tox]
requires =
    tox>=4.60
    tox-uv>=1.36
env_list =
    py3{10,11,12,13,14,15}-django52
    py3{12,13,14,15}-django6{0,1}
    py315t-django{52,60,61}

[testenv]
package = wheel
dependency_groups = dev
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    pytest {posargs:tests}
set_env =
    PYTHONDEVMODE = 1
    PYTHONPATH = {toxinidir}

# 3.15t is the first free-threaded build this package supports. Force the GIL
# off so the job cannot silently run with it re-enabled.
[testenv:py315t-django{52,60,61}]
set_env =
    {[testenv]set_env}
    PYTHON_GIL = 0
