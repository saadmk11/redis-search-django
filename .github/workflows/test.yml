name: Django Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t"]
        django-version: ["5.2", "6.0", "6.1"]

        exclude:
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.10"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"

    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests with Python ${{ matrix.python-version }} and Django ${{ matrix.django-version }}
        run: |
          TOX_ENV=$(echo "py${{ matrix.python-version}}-django${{ matrix.django-version}}" | tr -d .)
          uvx --with tox-uv tox -e $TOX_ENV

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
